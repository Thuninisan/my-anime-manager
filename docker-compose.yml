services:
  my-anime-manager:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TMDB_API_KEY=改成你的TMDB_API_KEY
      - QBITTORRENT_URL=http://改成你的qBittorrent_IP:8080
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=改成你的qBittorrent密码
      - QBITTORRENT_SAVE_PATH=/downloads
      - PROXY_HOST=
      - PROXY_PORT=7890
      - WATCH_DIR=/torrents
      - TZ=Asia/Shanghai
      - MAM_REPO_URL=https://github.com/Thuninisan/my-anime-manager.git
      - MAM_BRANCH=main
    volumes:
      - mam-source:/app/source
      - ./mam-data:/app/data
      - /改成你的种子目录路径:/torrents
      - /改成你的下载目录路径:/downloads
volumes:
  mam-source:
